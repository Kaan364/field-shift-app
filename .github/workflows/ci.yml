name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testler (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sözdizimi kontrolü
        run: python -m compileall -q app

      - name: Testler
        run: python -m pytest -q

  docker:
    name: Docker imajı derle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tarla-dostu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Konteyner sağlık kontrolü
        run: |
          docker run -d --rm --name tarla-ci -p 8000:8000 tarla-dostu:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "health OK"
              curl -fsS http://127.0.0.1:8000/app/ | grep -q "Tarla Dostu"
              echo "UI OK"
              docker stop tarla-ci
              exit 0
            fi
            sleep 2
          done
          echo "Konteyner sağlıklı başlamadı" >&2
          docker logs tarla-ci >&2 || true
          docker stop tarla-ci || true
          exit 1
